<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The head names no other colour and no face. It does REFERENCE two, and
         both are off-system: public/favicon.svg is built on #863BFF / #7E14FF /
         #47BFFF, and public/og-image.png is a blue-black plate with an indigo
         bloom and a violet mark tile. Neither hue exists anywhere in the token
         set — they predate the platinum system as well as this one. They are
         assets, not markup, so they are flagged here rather than patched here. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Must track --color-bg in src/index.css (#050505) -->
    <meta name="theme-color" content="#050505" />
    <!-- The head now describes a waitlist, not a brokerage account, and every
         string below moved with the page. The old set sold "flat-fee pricing"
         and "open your demat account in minutes" — a share preview promising an
         account a visitor cannot yet open is a worse first impression than no
         preview, because it is the one part of the page a reader sees before
         they arrive. -->
    <meta
      name="description"
      content="Thinq is a trading terminal for Indian markets that watches every instrument you follow and writes what changed in plain English. Join the waitlist for six months of zero Thinq brokerage; statutory charges apply."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thinq — the chart tells you what just moved" />
    <meta
      property="og:description"
      content="A trading terminal for Indian markets, not yet open. Six months of zero Thinq brokerage for everyone on the waitlist; statutory charges apply."
    />
    <!-- TODO (blocking, docs/go-live-checklist.md): og-image.png is the OLD
         share card. It is a blue-black plate on #863BFF / #7E14FF / #47BFFF —
         hues that exist nowhere in this token set — and it renders a fabricated
         Nifty chart with an order ticket, which docs/art-direction.md §2.1
         refuses outright. It also advertises a product that has not opened. -->
    <meta property="og:image" content="/og-image.png" />
    <meta
      property="og:image:alt"
      content="Thinq — a trading terminal for Indian markets"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- TODO (blocking): replace the bracketed values once the legal entity
         details are confirmed. These are structured data a search engine reads
         as fact, so an invented legal name here is the same offence as an
         invented registration number in the footer. -->
    <link rel="canonical" href="https://[thinq-domain.example]/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "FinancialService"],
        "name": "Thinq",
        "legalName": "[Legal entity name Private Limited]",
        "url": "https://[thinq-domain.example]/",
        "email": "[support@thinq.example]",
        "telephone": "[+91 XXXXX XXXXX]",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "[Full address]",
          "addressLocality": "[City]",
          "addressRegion": "[State]",
          "postalCode": "[PIN]",
          "addressCountry": "IN"
        },
        "sameAs": []
      }
    </script>

    <!-- Google Fonts for ultra-premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <title>Thinq — the chart tells you what just moved</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
