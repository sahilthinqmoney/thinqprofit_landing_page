<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Generated by scripts/gen-favicons.mjs from scripts/assets/thinq-mark.svg; run
         `npm run favicons` after changing the mark rather than editing these.
         Every one is an OPAQUE #050505 tile. They used to be the white mark on
         transparency, which is invisible on a light tab strip — the default in
         Chrome, Safari and Firefox — so the tab showed nothing and the icon
         looked like it had never updated. #050505 is --color-bg and the same
         value as theme-color below, so tab and page agree.
         Bump ?v= when the icon changes: browsers cache favicons far harder
         than they cache anything else, and a plain reload will not refresh one. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=7" sizes="16x16 32x32 48x48" />
    <!-- Chrome and Firefox prefer the SVG when one is offered, so it is the icon
         those two actually draw and it must be a finished design, not a source
         file. It was previously the bare white mark on transparency — invisible
         on a light tab strip — which is why the icon looked stale no matter what
         the PNGs said. It is now generated as the same opaque tile they are. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=7" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=7" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=7" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=7" />
    <link rel="manifest" href="/site.webmanifest?v=7" />
    <!-- The hero's still, not its clip. Preloading the video spent the first
         megabytes of a cold connection on an asset that may never be allowed to
         play — on a metered or slow link the ladder in src/lib/mediaTier.ts
         stops at this poster, and on a fast one the clip is fetched on its own
         once the poster is up. The poster is what the reader sees first either
         way, so it is the only media worth racing the page for. -->
    <link
      rel="preload"
      href="/clips/hero-backdrop-poster.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Pre-launch, and now the only restraint on this page other than the URL
         being unadvertised: the deployment is publicly reachable. The canonical
         below is still a placeholder domain and the footer still renders
         bracketed SEBI registrations, so an indexed copy of this page would
         outlive the draft it was taken from. `noarchive` is here because
         `noindex` alone does not stop a cached copy being served. Paired with
         public/robots.txt; remove both at launch. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <!-- Must track --color-bg in src/index.css (#050505) -->
    <meta name="theme-color" content="#050505" />
    <!-- The head now describes a waitlist, not a brokerage account, and every
         string below moved with the page. The old set sold "flat-fee pricing"
         and "open your demat account in minutes" — a share preview promising an
         account a visitor cannot yet open is a worse first impression than no
         preview, because it is the one part of the page a reader sees before
         they arrive. -->
    <meta
      name="description"
      content="Thinq is a trading terminal for Indian markets that watches every instrument you follow and writes what changed in plain English. Join the waitlist for six months of zero Thinq brokerage; statutory charges apply."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thinq — the chart tells you what just moved" />
    <meta
      property="og:description"
      content="A trading terminal for Indian markets, not yet open. Six months of zero Thinq brokerage for everyone on the waitlist; statutory charges apply."
    />
    <!-- TODO (blocking, docs/go-live-checklist.md): og-image.png is the OLD
         share card. It is a blue-black plate on #863BFF / #7E14FF / #47BFFF —
         hues that exist nowhere in this token set — and it renders a fabricated
         Nifty chart with an order ticket, which docs/art-direction.md §2.1
         refuses outright. It also advertises a product that has not opened. -->
    <meta property="og:image" content="/og-image.png" />
    <meta
      property="og:image:alt"
      content="Thinq — a trading terminal for Indian markets"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- TODO (blocking): replace the bracketed values once the legal entity
         details are confirmed. These are structured data a search engine reads
         as fact, so an invented legal name here is the same offence as an
         invented registration number in the footer. -->
    <link rel="canonical" href="https://[thinq-domain.example]/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "FinancialService"],
        "name": "Thinq",
        "legalName": "[Legal entity name Private Limited]",
        "url": "https://[thinq-domain.example]/",
        "email": "[support@thinq.example]",
        "telephone": "[+91 XXXXX XXXXX]",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "[Full address]",
          "addressLocality": "[City]",
          "addressRegion": "[State]",
          "postalCode": "[PIN]",
          "addressCountry": "IN"
        },
        "sameAs": []
      }
    </script>

    <!-- Google Fonts for ultra-premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint. As a plain stylesheet this sat
         in front of every pixel on the page: on a 400kbps link it pushed first
         paint to 4.8s, which the reader spends looking at nothing. The
         `media="print"` swap lets the parser walk straight past it and applies
         it the moment it lands; `display=swap` in the URL already means the
         copy is readable in the fallback face until then. -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>Thinq — the chart tells you what just moved</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
