<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The head names no other colour and no face. It does REFERENCE two, and
         both are off-system: public/favicon.svg is built on #863BFF / #7E14FF /
         #47BFFF, and public/og-image.png is a blue-black plate with an indigo
         bloom and a violet mark tile. Neither hue exists anywhere in the token
         set — they predate the platinum system as well as this one. They are
         assets, not markup, so they are flagged here rather than patched here. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Must track --color-bg in src/index.css (#050505) -->
    <meta name="theme-color" content="#050505" />
    <meta
      name="description"
      content="Open a free demat account with ThinqProfit. Trade stocks, ETFs, F&amp;O, commodities and mutual funds with flat-fee pricing and a platform built for speed."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ThinqProfit — Trade Stocks, F&amp;O and Mutual Funds in India" />
    <meta
      property="og:description"
      content="Flat-fee trading, direct mutual funds, and a platform that keeps up with the market. Open your demat account in minutes."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta
      property="og:image:alt"
      content="ThinqProfit app showing a Nifty 50 chart and an open order ticket"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- TODO: replace the bracketed values once the legal entity details are confirmed. -->
    <link rel="canonical" href="https://[thinqprofit.com]/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "FinancialService"],
        "name": "ThinqProfit",
        "legalName": "[ThinqProfit Securities Private Limited]",
        "url": "https://[thinqprofit.com]/",
        "email": "[support@thinqprofit.com]",
        "telephone": "[+91 XXXXX XXXXX]",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "[Full address]",
          "addressLocality": "[City]",
          "addressRegion": "[State]",
          "postalCode": "[PIN]",
          "addressCountry": "IN"
        },
        "sameAs": []
      }
    </script>

    <!--
      No font <link> and no preconnects. IBM Plex Sans and IBM Plex Mono are
      self-hosted through @fontsource and imported at the top of src/index.css,
      which is the right call here for a reason that has already bitten this
      file: a hosted stylesheet has to name every variable axis in its URL, and
      the axis list is the one part of a font declaration nothing validates —
      drop `wdth` from the query and every `font-variation-settings` rule on the
      page silently does nothing, including the hero's entire opening. A local
      @font-face carries the axes in the file. It also removes two DNS+TLS
      handshakes to a third-party origin from the critical path, and the faces
      now ship from the same origin as the CSS that references them.
    -->

    <title>ThinqProfit — Trade Stocks, F&amp;O and Mutual Funds in India</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
